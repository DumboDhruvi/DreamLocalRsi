[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dream-rsi"
version = "0.1.0"
description = "A coding-agent orchestration and recursive self-improvement layer inspired by Dream-RSI (arXiv:2609.14858)"
authors = [{ name = "Dream-RSI Developer" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=5.4.1",
    "click>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
dream-rsi = "dream_rsi.cli:main"
